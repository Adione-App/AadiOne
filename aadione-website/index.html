<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aadione — Everything You Need, Delivered.</title>
    <meta
      name="description"
      content="Aadione is a local shopping app: order groceries, fresh fruits and vegetables and food from local restaurants, delivered to your doorstep in approved villages. Download on Google Play and the App Store."
    />
    <link rel="canonical" href="https://adione.in/" />
    <meta name="theme-color" content="#176230" />

    <!-- Icons: the official Aadione app icon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Store listings (also shown as smart banners on iPhone) -->
    <meta name="apple-itunes-app" content="app-id=6817763486" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aadione" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://adione.in/" />
    <meta property="og:title" content="Aadione — Everything You Need, Delivered." />
    <meta
      property="og:description"
      content="Order groceries, fresh fruits and vegetables and food from local restaurants with the Aadione app, delivered to your doorstep in approved villages."
    />
    <meta property="og:image" content="https://adione.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aadione — Everything You Need, Delivered." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aadione — Everything You Need, Delivered." />
    <meta
      name="twitter:description"
      content="Order groceries, fresh fruits and vegetables and food from local restaurants with the Aadione app."
    />
    <meta name="twitter:image" content="https://adione.in/og-image.png" />

    <!-- Structured data: no ratings, reviews, prices or customer numbers. The
         support contact and social profiles are added from Admin Configuration
         at runtime (src/components/StructuredData.jsx). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://adione.in/#website",
            "url": "https://adione.in/",
            "name": "Aadione",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://adione.in/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://adione.in/#organization",
            "name": "Aadione",
            "url": "https://adione.in/",
            "logo": "https://adione.in/icon-512.png"
          },
          {
            "@type": "MobileApplication",
            "name": "Aadione",
            "operatingSystem": "Android",
            "applicationCategory": "ShoppingApplication",
            "url": "https://play.google.com/store/apps/details?id=in.adione.app",
            "installUrl": "https://play.google.com/store/apps/details?id=in.adione.app",
            "publisher": { "@id": "https://adione.in/#organization" }
          },
          {
            "@type": "MobileApplication",
            "name": "Aadione",
            "operatingSystem": "iOS",
            "applicationCategory": "ShoppingApplication",
            "url": "https://apps.apple.com/in/app/aadione/id6817763486",
            "installUrl": "https://apps.apple.com/in/app/aadione/id6817763486",
            "publisher": { "@id": "https://adione.in/#organization" }
          }
        ]
      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://api.adione.in" crossorigin />

  <body class="bg-white text-ink font-sans antialiased">
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">
        Aadione — Everything You Need, Delivered. Get the app on

        <a href="https://apps.apple.com/in/app/aadione/id6817763486">App Store</a>.
