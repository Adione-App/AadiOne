<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Aadione">
  <!--
    Aadione mark — the master definition. Every PNG size in this folder and in
    mobile/assets is a rasterisation of exactly this geometry, so changing the
    brand colour or the letterform here and re-running the icon generator keeps
    the launcher icon, the favicon and the in-app mark identical.

    Stroke, not an outline path, so the weight stays adjustable in one number.
  -->
  <rect width="1024" height="1024" rx="230" fill="#1E8E3E"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 800 L512 208 L728 800"/>
    <path d="M374 636 H650"/>
  </g>
</svg>
